<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Финансовый Трекер</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <style>
    :root {
      --bg-main: #09090b;
      --card-bg: rgba(24, 24, 27, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      
      --color-green: #10b981;
      --color-yellow: #f59e0b;
      --color-orange: #f97316;
      --color-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
      min-height: 100vh;
    }

    .container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .date-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dashboard {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .thermo-container {
      width: 28px;
      height: 160px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column-reverse;
    }

    .thermo-fill {
      width: 100%;
      height: 0%;
      background: var(--color-green);
      border-radius: 12px;
      transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.5s ease, box-shadow 0.5s ease;
      position: relative;
    }
    
    .thermo-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 4px; right: 4px; bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      border-radius: 12px;
    }

    .dashboard-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .amount-spent {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 0;
      line-height: 1;
      transition: color 0.3s ease;
    }

    .amount-limit {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 14px 14px 44px;
      color: white;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s ease;
      outline: none;
    }

    select {
      appearance: none;
      cursor: pointer;
    }

    select option {
      background: #18181b;
      color: white;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    input.limit-input {
      width: 80px;
      padding: 8px 12px;
      text-align: center;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: none;
      font-weight: 600;
      font-size: 1rem;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
    }

    button.btn-add {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    button.btn-add:active {
      transform: scale(0.98);
    }

    .list-header {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .expense-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      border: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-name { font-weight: 500; font-size: 1rem; }
    .item-tag { font-size: 0.75rem; color: var(--color-yellow); display: flex; align-items: center; gap: 4px; }
    .item-price { font-weight: 700; font-size: 1.1rem; }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn.delete:hover { color: var(--color-red); border-color: var(--color-red); }
    .icon-btn.edit:hover { color: var(--accent); border-color: var(--accent); }

    .history-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      backdrop-filter: blur(12px);
    }

    .history-date {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .status-ring {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    .history-total { font-weight: 800; font-size: 1.2rem; }

    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 420px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      display: flex;
      justify-content: space-around;
      padding: 6px;
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 0;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .nav-btn i { font-size: 1.4rem; transition: transform 0.3s ease; }
    
    .nav-btn.active {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }
    
    .nav-btn.active i {
      color: var(--accent);
      transform: translateY(-2px) scale(1.1);
    }

    /* Модальное окно редактирования */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 200;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      width: 100%;
      max-width: 360px;
      background: #18181b;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
    }

  </style>
</head>
<body>

  <!-- Вкладка: Главная -->
  <div id="view-main" class="view active container">
    <div class="card">
      <div class="header">
        <div class="date-title"><i class='bx bx-calendar'></i> <span id="currentDate"></span></div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 0.85rem; color: var(--text-muted);">Лимит:</span>
          <input type="number" id="dailyLimit" class="limit-input" value="20" onchange="updateUI()">
        </div>
      </div>

      <div class="dashboard">
        <div class="thermo-container">
          <div id="thermoFill" class="thermo-fill"></div>
        </div>
        
        <div class="dashboard-info">
          <span style="color: var(--text-muted); font-size: 0.9rem; font-weight: 500;">Потрачено за сегодня</span>
          <div class="amount-spent" id="totalSpent">0.00</div>
          <div class="amount-limit" id="limitInfo">из 20.00 BYN</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="list-header"><i class='bx bx-plus-circle'></i> Новая запись</div>
      
      <div class="input-wrapper">
        <i class='bx bx-purchase-tag-alt'></i>
        <input type="text" id="itemName" placeholder="Название (напр. Энергетик)">
      </div>
      
      <div class="input-wrapper">
        <i class='bx bx-ruble'></i>
        <input type="number" id="itemPrice" placeholder="Сумма (BYN)" step="0.1">
      </div>
      
      <label class="checkbox-wrapper">
        <input type="checkbox" id="isFixed"> 
        <span><b>Фиксированный платеж</b> (не сжигает лимит)</span>
      </label>
      
      <button class="btn-add" onclick="addExpense()">
        <i class='bx bx-check'></i> Добавить
      </button>
    </div>

    <div class="card">
      <div class="list-header"><i class='bx bx-list-ul'></i> История за сегодня</div>
      <ul class="expense-list" id="expensesList"></ul>
    </div>
  </div>

  <!-- Вкладка: Календарь -->
  <div id="view-calendar" class="view container">
    <div class="card">
      <h2 style="margin: 0 0 20px 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px;">
        <i class='bx bx-history' style="color: var(--accent);"></i> Вся история
      </h2>
      <div id="historyContainer" class="history-grid"></div>
    </div>
  </div>

  <!-- Вкладка: Правка/Администрирование -->
  <div id="view-edit" class="view container">
    <div class="card">
      <h2 style="margin: 0 0 15px 0; font-size: 1.4rem; display: flex; align-items: center; gap: 10px;">
        <i class='bx bx-slider-alt' style="color: var(--accent);"></i> Управление
      </h2>
      
      <div style="margin-bottom: 15px;">
        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 6px;">Выберите дату для редактирования:</label>
        <div class="input-wrapper">
          <i class='bx bx-calendar-event'></i>
          <select id="editDateSelect" onchange="renderEditList()"></select>
        </div>
      </div>

      <div class="list-header"><i class='bx bx-edit'></i> Записи за выбранный день</div>
      <ul class="expense-list" id="editExpensesList"></ul>
    </div>
  </div>

  <!-- Плавающая панель навигации -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('main')" id="btn-main">
      <i class='bx bxs-home'></i>
      <span>Главная</span>
    </button>
    <button class="nav-btn" onclick="switchTab('calendar')" id="btn-calendar">
      <i class='bx bxs-calendar'></i>
      <span>Календарь</span>
    </button>
    <button class="nav-btn" onclick="switchTab('edit')" id="btn-edit">
      <i class='bx bxs-edit-alt'></i>
      <span>Правка</span>
    </button>
  </div>

  <!-- Модальное окно редактирования отдельного товара -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 style="margin-top: 0;">Изменить позицию</h3>
      <input type="hidden" id="modalItemId">
      
      <div class="input-wrapper">
        <i class='bx bx-purchase-tag-alt'></i>
        <input type="text" id="modalItemName" placeholder="Название">
      </div>
      
      <div class="input-wrapper">
        <i class='bx bx-ruble'></i>
        <input type="number" id="modalItemPrice" placeholder="Цена (BYN)" step="0.1">
      </div>

      <label class="checkbox-wrapper">
        <input type="checkbox" id="modalIsFixed"> 
        <span>Фиксированный платеж</span>
      </label>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-add" style="background: rgba(255,255,255,0.1); color: white;" onclick="closeModal()">Отмена</button>
        <button class="btn-add" onclick="saveEditedItem()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#09090b');
    tg.setBackgroundColor('#09090b');

    function getMskDateStr() {
      const options = { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', year: 'numeric' };
      return new Intl.DateTimeFormat('ru-RU', options).format(new Date());
    }

    const todayStr = getMskDateStr();
    document.getElementById('currentDate').innerText = todayStr;

    function getStorageData() {
      return JSON.parse(localStorage.getItem('finTrackerPro') || '{}');
    }

    function saveStorageData(data) {
      localStorage.setItem('finTrackerPro', JSON.stringify(data));
    }

    function switchTab(tabName) {
      ['main', 'calendar', 'edit'].forEach(t => {
        document.getElementById(`view-${t}`).classList.remove('active');
        document.getElementById(`btn-${t}`).classList.remove('active');
      });

      document.getElementById(`view-${tabName}`).classList.add('active');
      document.getElementById(`btn-${tabName}`).classList.add('active');

      if (tabName === 'calendar') renderCalendar();
      else if (tabName === 'edit') initEditView();
      else updateUI();
    }

    function addExpense() {
      const name = document.getElementById('itemName').value.trim();
      const price = parseFloat(document.getElementById('itemPrice').value);
      const isFixed = document.getElementById('isFixed').checked;

      if (!name || isNaN(price) || price <= 0) {
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        return;
      }

      const data = getStorageData();
      if (!data[todayStr]) data[todayStr] = [];

      data[todayStr].push({ id: Date.now(), name, price, isFixed });
      saveStorageData(data);

      document.getElementById('itemName').value = '';
      document.getElementById('itemPrice').value = '';
      document.getElementById('isFixed').checked = false;

      if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      updateUI();
    }

    function deleteExpense(dateStr, itemId) {
      const data = getStorageData();
      if (data[dateStr]) {
        data[dateStr] = data[dateStr].filter(item => item.id !== itemId);
        if (data[dateStr].length === 0) delete data[dateStr];
        saveStorageData(data);
      }
      if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
      updateUI();
      if (document.getElementById('view-edit').classList.contains('active')) {
        initEditView();
      }
    }

    function updateUI() {
      const limit = parseFloat(document.getElementById('dailyLimit').value) || 20;
      const data = getStorageData();
      const todayExpenses = data[todayStr] || [];

      let dailyTotal = 0;
      const listEl = document.getElementById('expensesList');
      listEl.innerHTML = '';

      if (todayExpenses.length === 0) {
        listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 10px;">Покупок пока нет ✨</div>';
      }

      todayExpenses.forEach(item => {
        if (!item.isFixed) dailyTotal += item.price;
        
        const li = document.createElement('li');
        li.className = 'expense-item';
        li.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            ${item.isFixed ? `<span class="item-tag"><i class='bx bxs-star'></i> Фикс. платеж</span>` : ''}
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <span class="item-price">${item.price.toFixed(2)}</span>
            <button class="icon-btn delete" onclick="deleteExpense('${todayStr}', ${item.id})"><i class='bx bx-trash'></i></button>
          </div>
        `;
        listEl.appendChild(li);
      });

      document.getElementById('totalSpent').innerText = dailyTotal.toFixed(2);
      document.getElementById('limitInfo').innerText = `из ${limit.toFixed(2)} BYN`;

      const fillEl = document.getElementById('thermoFill');
      const textEl = document.getElementById('totalSpent');
      let percentage = Math.min((dailyTotal / limit) * 100, 100);
      
      fillEl.style.height = `${percentage}%`;

      let color = 'var(--color-green)';
      let shadow = 'rgba(16, 185, 129, 0.5)';
      
      if (dailyTotal >= limit) {
        color = 'var(--color-red)';
        shadow = 'rgba(239, 68, 68, 0.6)';
        textEl.style.color = 'var(--color-red)';
      } else if (dailyTotal >= limit * 0.8) {
        color = 'var(--color-orange)';
        shadow = 'rgba(249, 115, 22, 0.5)';
        textEl.style.color = 'var(--color-orange)';
      } else if (dailyTotal >= limit * 0.5) {
        color = 'var(--color-yellow)';
        shadow = 'rgba(245, 158, 11, 0.5)';
        textEl.style.color = 'var(--text-main)';
      } else {
        textEl.style.color = 'var(--text-main)';
      }

      fillEl.style.background = color;
      fillEl.style.boxShadow = `0 0 15px ${shadow}`;
    }

    function renderCalendar() {
      const limit = parseFloat(document.getElementById('dailyLimit').value) || 20;
      const data = getStorageData();
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';

      const dates = Object.keys(data).sort((a, b) => {
        const [d1, m1, y1] = a.split('.');
        const [d2, m2, y2] = b.split('.');
        return new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1);
      });

      if (dates.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">История пуста</div>';
        return;
      }

      dates.forEach(date => {
        let spent = 0;
        data[date].forEach(item => { if (!item.isFixed) spent += item.price; });

        let color = 'var(--color-green)';
        if (spent >= limit) color = 'var(--color-red)';
        else if (spent >= limit * 0.8) color = 'var(--color-orange)';
        else if (spent >= limit * 0.5) color = 'var(--color-yellow)';

        const isToday = date === todayStr;
        
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-date">
            <span class="status-ring" style="color: ${color}; background-color: ${color};"></span>
            ${isToday ? 'Сегодня (' + date + ')' : date}
          </div>
          <div class="history-total" style="color: ${color}">${spent.toFixed(2)} BYN</div>
        `;
        container.appendChild(card);
      });
    }

    /* Логика раздела "Правка" */
    function initEditView() {
      const data = getStorageData();
      const select = document.getElementById('editDateSelect');
      select.innerHTML = '';

      const dates = Object.keys(data).sort((a, b) => {
        const [d1, m1, y1] = a.split('.');
        const [d2, m2, y2] = b.split('.');
        return new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1);
      });

      if (dates.length === 0) {
        select.innerHTML = '<option value="">Нет записанных дней</option>';
        document.getElementById('editExpensesList').innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 10px;">Нет данных</div>';
        return;
      }

      dates.forEach(date => {
        const opt = document.createElement('option');
        opt.value = date;
        opt.innerText = date === todayStr ? `Сегодня (${date})` : date;
        select.appendChild(opt);
      });

      renderEditList();
    }

    function renderEditList() {
      const selectedDate = document.getElementById('editDateSelect').value;
      const data = getStorageData();
      const items = data[selectedDate] || [];
      const listEl = document.getElementById('editExpensesList');
      listEl.innerHTML = '';

      if (items.length === 0) {
        listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 10px;">В этот день не было покупок</div>';
        return;
      }

      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'expense-item';
        li.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            <span class="item-price" style="font-size: 0.95rem; color: var(--text-muted);">${item.price.toFixed(2)} BYN ${item.isFixed ? '(Фикс.)' : ''}</span>
          </div>
          <div class="action-btns">
            <button class="icon-btn edit" onclick="openEditModal('${selectedDate}', ${item.id})"><i class='bx bx-pencil'></i></button>
            <button class="icon-btn delete" onclick="deleteExpense('${selectedDate}', ${item.id})"><i class='bx bx-trash'></i></button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function openEditModal(dateStr, itemId) {
      const data = getStorageData();
      const item = (data[dateStr] || []).find(i => i.id === itemId);
      if (!item) return;

      document.getElementById('modalItemId').value = itemId;
      document.getElementById('modalItemName').value = item.name;
      document.getElementById('modalItemPrice').value = item.price;
      document.getElementById('modalIsFixed').checked = item.isFixed;

      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    function saveEditedItem() {
      const selectedDate = document.getElementById('editDateSelect').value;
      const itemId = parseInt(document.getElementById('modalItemId').value);
      const name = document.getElementById('modalItemName').value.trim();
      const price = parseFloat(document.getElementById('modalItemPrice').value);
      const isFixed = document.getElementById('modalIsFixed').checked;

      if (!name || isNaN(price) || price <= 0) return;

      const data = getStorageData();
      if (data[selectedDate]) {
        const item = data[selectedDate].find(i => i.id === itemId);
        if (item) {
          item.name = name;
          item.price = price;
          item.isFixed = isFixed;
          saveStorageData(data);
        }
      }

      closeModal();
      if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      renderEditList();
      updateUI();
    }

    // Инициализация
    updateUI();
  </script>
</body>
</html>
